name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip "setuptools>=69" wheel
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip "setuptools>=69" wheel
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_packaging.py --cov=bcd_lab --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip "setuptools>=69" wheel
          python -m pip install -e ".[dev]"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify packaged resources
        run: python -m pytest -q tests/test_packaging.py
      - name: Smoke-test the built wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "from bcd_lab.experiments.loader import load_default_block; assert load_default_block('bcd')['z_optimizer']['params']['learning_rate'] == 0.1"
          .wheel-venv/bin/bcd-lab --help
