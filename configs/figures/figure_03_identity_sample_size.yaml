# Figure 3 parameter study from arXiv:2605.26271.
#
# Reproduces the reported n=T=1000, rank=10, identity link, 10,000-iteration
# horizon, and M/(n*rank) sweep from 1 through 8. The paper does not report the
# random seed. Parameters specified by the archived research config are used
# below; the current named random streams remain intentionally different.
# Expected workload: a long research run, not a quickstart example.
schema_version: 2
experiment: figure_03_identity_sample_size

algorithm:
  name: bcd
  params:
    regularization:
      lambda_: 0.0
      mu: 1.0
      alpha: 0.0
    z_optimizer:
      name: gradient_descent
      params:
        learning_rate: 1.0e-2
    phi_update:
      learning_rate: 0.0
    project_z: false
    freeze_phi_updates: true

trials: 1
seed: 2026

data:
  source: synthetic
  type: standard_normal
  desirable: false
  noise_std: 0.0
  generating_link:
    name: identity
    params: {}
  evaluation_domain:
    central_mass: 0.95
    grid_count: 1000
  bounds:
    lower: -3.0
    upper: 3.0
  shape:
    n_rows: 1000
    n_cols: 1000
    rank: 10
    n_observations: 10000

link:
  kind: identity
  sigma: 1.0
  params: {}

objective:
  name: squared_error
  params: {}

initialization:
  mode: separate
  z:
    name: svd
    params: {}
  phi:
    name: none
    params: {}

runtime:
  max_iter: 10000
  tol: 0.0
  dtype: float64
  diagnostics_interval: 100
  save_checkpoints: false
  checkpoint_iters: []

diagnostics:
  on_error: raise
  families:
    objective: [loss]
    timing: [elapsed]
    reconstruction: [rmse]
    truth_matrix: [x_error]
    truth_z: [goodness]

sweep:
  axes:
    - path: data.shape.n_observations
      values: [10000, 20000, 30000, 40000, 50000, 60000, 70000, 80000]

plot:
  enabled: true
  dir: ../../plots/figure_03_identity_sample_size
  name: figure_03_identity_sample_size
  legend_key: data.shape.n_observations
  legend_title: "Observed entries M"
  max_plots_per_row: 3
  show_legend: true
  plot1:
    type: line
    x: iteration
    y: goodness
    y_scale: log
    title: "Factor error by sample size"
    xlabel: Iteration
    ylabel: Procrustes error
    pdf: figure_03_identity_sample_size
  plot2:
    type: line
    x: iteration
    y: x_error
    y_scale: log
    title: "Matrix error by sample size"
    xlabel: Iteration
    ylabel: Relative Frobenius error
    pdf: figure_03_identity_sample_size
  plot3:
    type: line
    x: iteration
    y: loss
    y_scale: log
    title: "Objective by sample size"
    xlabel: Iteration
    ylabel: Loss
    pdf: figure_03_identity_sample_size
