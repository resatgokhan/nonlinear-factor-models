# Tuned comparison of factor updates on the public MovieLens 100K subset.
# Prepare the data first with: bcd-lab preprocess ml-100k
# Learning rates were selected from a one-trial search over the same 50-point
# fixed-once quantile link and projection setting. A 200-iteration check placed the mean
# validation minimum at iteration 40 for both optimizers, so this public
# comparison stops there rather than continuing into overfitting. A
# projection-free Adam search over learning rates 1e-2 through 3e-1 did not
# improve validation performance, so both methods retain the same projection.
schema_version: 2
experiment: movielens_optimizer_comparison

algorithm:
  name: bcd
  params:
    regularization:
      alpha: 0.0
      lambda_: 0.0
      mu: 0.6
    z_optimizer:
      name: gradient_descent
      params:
        learning_rate: 1.0e-3
    phi_update:
      learning_rate: 1.0e-6
    project_z: true

trials: 3
seed: 100

data:
  source: csv
  path: ../../data/ml-100k.csv
  row_col: row
  col_col: col
  value_col: value
  has_header: true
  remap_ids: true
  shape:
    rank: 10
  size:
    max_rows: 500
    max_cols: 500
    strategy: top
  split:
    validation_fraction: 0.1
    stratify_by: row

link:
  kind: piecewise_linear_rkhs
  sigma: 1.0
  params:
    grid:
      count: 50
      bounds:
        name: input_quantiles
        params:
          lower_quantile: 0.01
          upper_quantile: 0.99
          pad_fraction: 0.25
          min_padding: 0.5
      rebuild:
        name: never
        params: {}
    monotone_phi_enabled: true
    monotone_phi_direction: increasing

objective:
  name: squared_error
  params: {}

initialization:
  mode: separate
  z:
    name: svd
    params: {}
  phi:
    name: identity_phi
    params: {}

runtime:
  max_iter: 40
  tol: 0.0
  dtype: float64
  diagnostics_interval: 5
  save_checkpoints: false
  checkpoint_iters: []

diagnostics:
  on_error: raise
  families:
    objective: [loss]
    timing: [elapsed]
    gradients: [z_grad_norm, z_optimizer_update_norm, phi_grad_norm]
    reconstruction: [rmse, mae]

selection:
  metric: validation_rmse
  mode: min
  retain_checkpoint: true

sweep:
  axes:
    - path: algorithm.params.z_optimizer
      values:
        - name: gradient_descent
          params:
            learning_rate: 1.0e-3
        - name: adam
          params:
            learning_rate: 1.0e-1

plot:
  enabled: true
  dir: ../../plots/movielens_optimizer_comparison
  name: movielens_optimizer_comparison
  legend_key: algorithm.params.z_optimizer.name
  legend_title: "Z optimizer"
  legend_y: 1.18
  max_plots_per_row: 2
  show_legend: true
  trial_stat: mean
  trial_error: std
  trial_grid: linear
  trial_grid_count: 9
  plot1:
    type: line
    x: iteration
    y: loss
    y_scale: log
    title: "Training objective"
    xlabel: Iteration
    ylabel: Mean loss
    pdf: movielens_optimizer_comparison
  plot2:
    type: line
    x: iteration
    y: validation_rmse
    title: "Validation reconstruction"
    xlabel: Iteration
    ylabel: Mean validation RMSE
    pdf: movielens_optimizer_comparison
  plot3:
    type: line
    x: iteration
    y: train_rmse
    title: "Training reconstruction"
    xlabel: Iteration
    ylabel: Mean train RMSE
    pdf: movielens_optimizer_comparison
  plot4:
    type: line
    x: iteration
    y: z_optimizer_update_norm
    title: "Factor update magnitude"
    xlabel: Iteration
    ylabel: Mean update norm
    pdf: movielens_optimizer_comparison
