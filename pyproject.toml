[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bcd-lab"
version = "0.1.0"
description = "Experimental framework for BCD-style matrix factorization research."
requires-python = ">=3.10"
authors = [
  { name = "Resat Gökhan", email = "resat.goekhan@tum.de" },
]
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy<2",
  "scipy",
  "scikit-learn",
  "PyYAML",
  "matplotlib",
  "cvxpy",
  "pandas",
  "xlrd>=2.0.1",
]

[project.scripts]
bcd-lab = "bcd_lab.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bcd_lab.experiments" = ["default_configs/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".idea"]

[tool.ruff.lint]
# Correctness, import ordering, and high-signal Bugbear checks.
select = ["E4", "E7", "E9", "F", "I", "B", "C90"]

[tool.ruff.lint.mccabe]
# Prevent new orchestration/dispatch functions from exceeding the current
# reviewed ceiling. Two cohesive invariant/numerical boundaries are explicit.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/bcd_lab/function_models/rkhs/projection.py" = ["C901"]
"src/bcd_lab/types.py" = ["C901"]

[tool.mypy]
python_version = "3.10"
# The enforced boundary grows with clarified component interfaces.
files = [
  "src/bcd_lab/atomic_io.py",
  "src/bcd_lab/cli.py",
  "src/bcd_lab/_registry.py",
  "src/bcd_lab/checkpoints.py",
  "src/bcd_lab/config.py",
  "src/bcd_lab/losses.py",
  "src/bcd_lab/randomness.py",
  "src/bcd_lab/types.py",
  "src/bcd_lab/algorithms/registry.py",
  "src/bcd_lab/experiments/schema.py",
  "src/bcd_lab/experiments/sweep.py",
  "src/bcd_lab/experiments/composition.py",
  "src/bcd_lab/experiments/loader.py",
  "src/bcd_lab/experiments/validation.py",
  "src/bcd_lab/experiments/runner.py",
  "src/bcd_lab/algorithms/bcd.py",
  "src/bcd_lab/algorithms/bcd_config.py",
  "src/bcd_lab/algorithms/bcd_snapshot.py",
  "src/bcd_lab/algorithms/bcd_loop.py",
  "src/bcd_lab/algorithms/numerics.py",
  "src/bcd_lab/algorithms/state.py",
  "src/bcd_lab/optimizers",
  "src/bcd_lab/function_models/base.py",
  "src/bcd_lab/function_models/checkpoints.py",
  "src/bcd_lab/function_models/distances.py",
  "src/bcd_lab/function_models/fixed_models.py",
  "src/bcd_lab/function_models/registry.py",
  "src/bcd_lab/function_models/rkhs/gaussianKernelMath.py",
  "src/bcd_lab/function_models/rkhs/gaussian_rkhs.py",
  "src/bcd_lab/function_models/rkhs/generators.py",
  "src/bcd_lab/function_models/rkhs/projection.py",
  "src/bcd_lab/initializers/base.py",
  "src/bcd_lab/initializers/builder.py",
  "src/bcd_lab/initializers/phi.py",
  "src/bcd_lab/initializers/registry.py",
  "src/bcd_lab/plotting",
  "src/bcd_lab/data",
  "src/bcd_lab/diagnostics",
]
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
